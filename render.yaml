# Render blueprint for TrustOra: one Postgres database, the API, and the static web app.
# Field names follow Render's blueprint spec (https://render.com/docs/blueprint-spec).
# Lines marked "verify" use a nesting the spec page did not show in full; check them in the
# Render dashboard's blueprint preview before the first sync.
#
# No secret values live in this file. Every key declared with `sync: false` is asked for once
# in the dashboard when the blueprint is first created. See docs/deploy.md.

databases:
  - name: trustora-db
    plan: free # Render's free Postgres expires 30 days after creation; see docs/deploy.md
    databaseName: trustora
    user: trustora

services:
  # --- API -------------------------------------------------------------------------------------
  - type: web
    name: trustora-api
    runtime: node
    plan: free
    # devDependencies are needed to compile TypeScript, so install them explicitly.
    # The api build first builds contracts, signals, memory and agent (prebuild script).
    buildCommand: npm ci --include=dev && npm run build -w @checkout-guardian/api
    # Apply migrations from the compiled output, then start the server.
    startCommand: node apps/api/dist/src/database/migrate.js && node apps/api/dist/src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase: # verify nesting
          name: trustora-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Set by hand after the first deploy to the public URL of the static site (no trailing slash).
      - key: CORS_ORIGIN
        sync: false
      # Access control. DEMO_ADMIN_TOKEN guards POST /api/demo/reset (refused in production when unset).
      # GUARDIAN_API_KEY, when set, is required as a bearer token on the agent routes.
      - key: DEMO_ADMIN_TOKEN
        sync: false
      - key: GUARDIAN_API_KEY
        sync: false
      # Audit encryption (docs/key-rotation.md). Secrets: generate 64 hex characters locally and paste
      # them only into the dashboard. No value belongs in this file. The PREVIOUS key is set only
      # while rotating. Set AUDIT_HMAC_KEY to the current key value before the first rotation.
      - key: AUDIT_ENCRYPTION_KEY
        sync: false
      - key: AUDIT_ENCRYPTION_KEY_PREVIOUS
        sync: false
      - key: AUDIT_HMAC_KEY
        sync: false
      # How the agent gets its signals and answers.
      # SIGNALS_MODE: replay (recorded signals for the demo stores), live, or auto (replay for the
      # demo stores, live for any other domain). LLM_MODE: replay, live or none.
      - key: SIGNALS_MODE
        value: auto
      - key: LLM_MODE
        value: replay
      # LLM_PROVIDER is gemini or openai-compatible. The key may also be given as GEMINI_API_KEY.
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL_FAST
        sync: false
      - key: LLM_MODEL_STRONG
        sync: false
      - key: KERNEL_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: CHANNEL3_BASE_URL
        sync: false
      # Optional corporate registry. Without a URL the local merchant_records table is used.
      - key: CORPORATE_REGISTRY_URL
        sync: false
      - key: CORPORATE_REGISTRY_API_KEY
        sync: false
      - key: CORPORATE_REGISTRY_TIMEOUT_MS
        value: "2500"
      # Check contact, privacy and terms links with bounded, safe fetches. Set "false" to skip.
      - key: VALIDATE_SECTION_PAGES
        value: "true"
      # Total model time per scan (ms); after it the deterministic output is used. 0 means no limit.
      - key: AGENT_MODEL_BUDGET_MS
        value: "1200"
      # Scam memory. A free Render instance has no persistent disk, so a memory file would be lost on
      # every restart and sleep; keep it in the process. To keep a file, mount a disk (a paid
      # feature), set MEMORY_MODE=file and MEMORY_FILE to a path on the disk. Or use Elasticsearch:
      # with ELASTIC_URL and ELASTIC_API_KEY set, the memory is stored there.
      - key: MEMORY_MODE
        value: memory
      - key: ELASTIC_URL
        sync: false
      - key: ELASTIC_API_KEY
        sync: false
      # Payee accounts for the three demo stores: PayPal sandbox business accounts.
      # See docs/paypal-sandbox.md. Without them the fixture values are used.
      - key: STORE_GENUINE_PAYEE_EMAIL
        sync: false
      - key: STORE_GENUINE_PAYEE_MERCHANT_ID
        sync: false
      - key: STORE_DISCOUNT_PAYEE_EMAIL
        sync: false
      - key: STORE_DISCOUNT_PAYEE_MERCHANT_ID
        sync: false
      - key: STORE_IMPERSONATOR_PAYEE_EMAIL
        sync: false
      - key: STORE_IMPERSONATOR_PAYEE_MERCHANT_ID
        sync: false

  # --- Web app (static) ------------------------------------------------------------------------
  - type: web
    name: trustora-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build -w @checkout-guardian/web
    staticPublishPath: apps/web/dist
    routes: # verify nesting
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_USE_MOCK
        value: "false"
      # Set by hand after the first deploy to the public URL of the API (no trailing slash).
      - key: VITE_API_URL
        sync: false
      # PayPal sandbox client id for the checkout button. Leave empty to use the simulated button.
      - key: VITE_PAYPAL_CLIENT_ID
        sync: false
